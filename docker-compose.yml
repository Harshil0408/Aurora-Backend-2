services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ecomm-api
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ecomm:${POSTGRES_PASSWORD:-ecomm_dev_password}@postgres:5432/ecomm
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
    networks:
      - ecomm-net
    command: npm run dev

  postgres:
    image: postgres:17-alpine
    container_name: ecomm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecomm
      POSTGRES_USER: ecomm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomm_dev_password}
    ports:
      # Host 5432 is blocked on Windows (Hyper-V reserved range) — use 5433.
      - '127.0.0.1:5433:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecomm -d ecomm']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ecomm-net

  redis:
    image: redis:8-alpine
    container_name: ecomm-redis
    restart: unless-stopped
    # Dev only: no password, bound to loopback. Add --requirepass for shared hosts.
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecomm-net

networks:
  ecomm-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
